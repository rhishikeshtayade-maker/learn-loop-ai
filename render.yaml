services:
  - type: web
    name: learnloop-ai
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
